<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AD Architecture — Action Items Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080c;--surface:#111116;--surface2:#19191f;--surface3:#222230;
  --border:#1e1e2c;--border2:#2c2c40;
  --text:#f0ede8;--text2:#a0a0ae;--text3:#5c5c6c;
  --accent:#ff6b35;--accent-dim:rgba(255,107,53,0.08);--accent-border:rgba(255,107,53,0.25);
  --red:#ff4757;--red-bg:rgba(255,71,87,0.07);--red-border:rgba(255,71,87,0.22);
  --orange:#ffa502;--orange-bg:rgba(255,165,2,0.07);--orange-border:rgba(255,165,2,0.22);
  --green:#2ed573;--green-bg:rgba(46,213,115,0.07);--green-border:rgba(46,213,115,0.22);
  --blue:#70a1ff;--blue-bg:rgba(112,161,255,0.07);--blue-border:rgba(112,161,255,0.22);
  --purple:#a29bfe;--purple-bg:rgba(162,155,254,0.07);--purple-border:rgba(162,155,254,0.22);
  --radius:10px;
}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.mono{font-family:'Space Mono',monospace}

/* LOADING */
#loadingOverlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.4s}
#loadingOverlay.fade{opacity:0;pointer-events:none}
.loader{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{margin-top:14px;color:var(--text2);font-size:13px}

/* CONFIG */
.config-banner{background:var(--accent-dim);border:1px solid var(--accent-border);margin:16px 28px;padding:16px 20px;border-radius:var(--radius);display:none}
.config-banner.show{display:block}
.config-banner h3{font-size:14px;color:var(--accent);margin-bottom:8px}
.config-banner p{font-size:12px;color:var(--text2);line-height:1.6}
.config-banner input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-family:inherit;font-size:12px;margin-top:8px;outline:none}
.config-banner input:focus{border-color:var(--accent)}
.config-banner button{background:var(--accent);color:#fff;border:none;padding:8px 20px;border-radius:6px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer;margin-top:10px}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;background:rgba(8,8,12,0.92);backdrop-filter:blur(20px)}
.topbar-left{display:flex;align-items:center;gap:14px}
.logo{width:36px;height:36px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;letter-spacing:-0.5px}
.topbar h1{font-size:16px;font-weight:600;letter-spacing:-0.3px}
.topbar h1 span{color:var(--text3);font-weight:400;font-size:13px;margin-left:8px}
.topbar-right{display:flex;align-items:center;gap:10px}
.sync-info{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.sync-dot.error{background:var(--red)}.sync-dot.loading{background:var(--orange);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:0.4}}
.btn-sm{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:6px 14px;border-radius:7px;cursor:pointer;font-family:inherit;font-size:12px;transition:all 0.12s}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}
.today-badge{font-size:11px;color:var(--text2);background:var(--surface2);padding:5px 12px;border-radius:20px;border:1px solid var(--border)}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:20px 28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat-card.r::before{background:var(--red)}.stat-card.o::before{background:var(--orange)}.stat-card.g::before{background:var(--green)}.stat-card.a::before{background:var(--accent)}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--text3);margin-bottom:5px;font-weight:500}
.stat-value{font-size:28px;font-weight:800;letter-spacing:-2px}
.stat-sub{font-size:11px;color:var(--text3);margin-top:3px}

/* CONTROLS */
.controls{display:flex;align-items:center;justify-content:space-between;padding:0 28px 16px;flex-wrap:wrap;gap:10px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filter-btn{background:var(--surface);border:1px solid var(--border);color:var(--text3);padding:6px 14px;border-radius:7px;cursor:pointer;font-size:12px;font-family:inherit;transition:all 0.12s;white-space:nowrap}
.filter-btn:hover{border-color:var(--text3);color:var(--text)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.search-box{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:7px;font-size:12px;font-family:inherit;width:200px;outline:none}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--text3)}
.sep{width:1px;height:22px;background:var(--border);margin:0 2px}
.view-tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:3px}
.view-tab{background:none;border:none;color:var(--text3);padding:6px 16px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;font-weight:500;transition:all 0.12s}
.view-tab:hover{color:var(--text)}
.view-tab.active{color:#fff;background:var(--accent);font-weight:600}

/* BY-PERSON VIEW */
.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;padding:0 28px 40px}
.person-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color 0.2s}
.person-card:hover{border-color:var(--border2)}
.person-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.person-left{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:8px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--accent);flex-shrink:0}
.person-name{font-size:14px;font-weight:700}
.person-meta{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;margin-top:2px}
.person-count{font-size:22px;font-weight:800;color:var(--accent)}
.person-items{padding:6px 0}
.action-row{display:grid;grid-template-columns:1fr 80px 70px;gap:8px;align-items:start;padding:10px 18px;border-bottom:1px solid rgba(30,30,44,0.5);font-size:12px;transition:background 0.08s}
.action-row:hover{background:rgba(255,107,53,0.02)}
.action-row:last-child{border-bottom:none}
.a-text{line-height:1.5;color:var(--text)}
.a-project{font-size:10px;color:var(--text3);margin-top:3px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px}
.a-date{font-family:'Space Mono',monospace;font-size:10px;text-align:center;color:var(--text3)}
.age-badge{font-size:10px;padding:3px 8px;border-radius:4px;font-weight:600;text-align:center;white-space:nowrap}
.age-badge.critical{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.age-badge.warning{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border)}
.age-badge.recent{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.age-badge.new{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}

/* TABLE VIEW */
.table-wrap{padding:0 28px 40px}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:60px;background:var(--surface);font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3);padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);z-index:10;cursor:pointer;user-select:none;transition:color 0.12s}
thead th:hover{color:var(--accent)}
thead th.sorted{color:var(--accent)}
thead th .arrow{font-size:8px;margin-left:4px}
tbody tr{border-bottom:1px solid rgba(30,30,44,0.5);transition:background 0.08s}
tbody tr:hover{background:rgba(255,107,53,0.02)}
tbody td{padding:10px 12px;font-size:12px;vertical-align:middle}
td.proj-cell{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
td.item-cell{max-width:350px;line-height:1.5}
td.who-cell{white-space:nowrap}
.who-pill{font-size:10px;padding:3px 8px;border-radius:4px;background:var(--surface3);color:var(--text2);font-weight:600;letter-spacing:0.3px}
.pri-badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600}
.pri-badge.high{background:var(--red-bg);color:var(--red)}.pri-badge.medium{background:var(--orange-bg);color:var(--orange)}.pri-badge.low{background:var(--blue-bg);color:var(--blue)}

/* PROJECT VIEW */
.project-list{padding:0 28px 40px}
.proj-group{margin-bottom:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.proj-group-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;transition:background 0.1s}
.proj-group-header:hover{background:var(--surface2)}
.proj-group-name{font-size:14px;font-weight:700}
.proj-group-count{font-size:12px;color:var(--accent);font-weight:700}
.proj-group-items{border-top:1px solid var(--border)}
.proj-action{display:grid;grid-template-columns:1fr 70px 80px 70px;gap:8px;align-items:center;padding:10px 18px;border-bottom:1px solid rgba(30,30,44,0.3);font-size:12px}
.proj-action:last-child{border-bottom:none}

.hidden{display:none!important}

@media(max-width:800px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .person-grid,.table-wrap,.project-list{padding:0 14px 32px}
  .topbar{padding:14px}
  .controls{padding:0 14px 12px}
  .person-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="loader"></div>
  <div class="load-text" id="loadStatus">Loading action items...</div>
</div>

<div class="config-banner" id="configBanner">
  <h3>⚙ Connect Your Google Sheet</h3>
  <p>Paste the spreadsheet ID or URL from the browser address bar (same sheet as your project dashboard).</p>
  <input id="inputSheetId" placeholder="Sheet ID or full URL">
  <button onclick="saveConfig()">Connect & Load</button>
</div>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">AI</div>
    <h1>Action Items <span>Pending Tracker</span></h1>
  </div>
  <div class="topbar-right">
    <div class="sync-info"><div class="sync-dot" id="syncDot"></div><span id="syncText">Synced</span></div>
    <button class="btn-sm" onclick="fetchAll()">↻ Refresh</button>
    <div class="today-badge mono" id="todayBadge"></div>
  </div>
</div>

<div class="stats-row" id="statsRow"></div>

<div class="controls">
  <div class="filters">
    <input type="text" class="search-box" placeholder="Search items, projects, people..." id="searchBox">
    <div class="sep"></div>
    <button class="filter-btn active" data-person="all">All People</button>
    <div id="personFilters"></div>
    <div class="sep"></div>
    <button class="filter-btn" data-age="critical">30+ days</button>
    <button class="filter-btn" data-age="warning">14+ days</button>
    <button class="filter-btn" data-age="recent">7+ days</button>
  </div>
  <div class="view-tabs">
    <button class="view-tab active" data-view="persons">By Person</button>
    <button class="view-tab" data-view="projects">By Project</button>
    <button class="view-tab" data-view="table">Full List</button>
  </div>
</div>

<div id="personsView" class="person-grid"></div>
<div id="projectsView" class="project-list hidden"></div>
<div id="tableView" class="table-wrap hidden"></div>

<script>
// ============================================================
//  CONFIG
// ============================================================
let SHEET_ID = '1nTiGsZuLfalNiy5FaL2JwWxJuGVLwtmVi7jFbB6xc3c';
try { const s = localStorage.getItem('ad_tracker_sheet_id'); if(s) SHEET_ID = s; } catch(e){}

const TODAY = new Date();
document.getElementById('todayBadge').textContent = TODAY.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});

let projects = [], actionItems = [], allTasks = [];
let currentPerson = 'all', currentAge = null, searchTerm = '';
let sortCol = 'age', sortDir = 'desc';

const NAME_MAP = {LT:'Luis Troncoso',DZ:'Daniella Zamora',AIC:'Anna Isabel Cadena',MQ:'Maria Elisa Quinayas',JDC:'Juan David Cardenas',DO:'Daniela Ortegon',SC:'Sebastian Cortes',SF:'Sandra Flores',CL:'Camilo Leon',MH:'MH',OC:'Oscar Cabeza'};

// ============================================================
//  GOOGLE SHEETS LOADER (JSONP)
// ============================================================
function cellValue(cell) {
  if (!cell || cell.v === null || cell.v === undefined) return '';
  if (typeof cell.v === 'string' && cell.v.startsWith('Date(')) {
    const parts = cell.v.replace('Date(','').replace(')','').split(',').map(Number);
    return new Date(parts[0], parts[1], parts[2]).toISOString().split('T')[0];
  }
  return String(cell.v).trim();
}

function loadSheet(sheetId, sheetName) {
  return new Promise((resolve, reject) => {
    const cb = '_gs_' + sheetName + '_' + Date.now();
    const timeout = setTimeout(() => { delete window[cb]; reject(new Error('Timeout')); }, 15000);
    window[cb] = function(response) {
      clearTimeout(timeout); delete window[cb];
      try {
        const table = response.table;
        let headers = table.cols.map(c => c.label.trim().toLowerCase().replace(/\s+/g,'_'));
        let dataRows = table.rows;
        if (headers.every(h => /^[a-z]$/.test(h) || h === '') && dataRows.length > 0) {
          headers = dataRows[0].c.map(c => cellValue(c).toLowerCase().replace(/\s+/g,'_'));
          dataRows = dataRows.slice(1);
        }
        const validCols = headers.map((h,i) => ({h,i})).filter(x => x.h && x.h !== '');
        const rows = dataRows.map(r => {
          const obj = {};
          validCols.forEach(({h,i}) => { obj[h] = r.c && r.c[i] ? cellValue(r.c[i]) : ''; });
          return obj;
        }).filter(r => Object.values(r).some(v => v));
        resolve(rows);
      } catch(e) { reject(e); }
    };
    const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=1&sheet=${encodeURIComponent(sheetName)}`;
    const script = document.createElement('script');
    script.src = url;
    script.onerror = () => { clearTimeout(timeout); delete window[cb]; reject(new Error('Load failed')); };
    document.head.appendChild(script);
    script.addEventListener('load', () => setTimeout(() => script.remove(), 100));
  });
}

async function fetchAll() {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  dot.className = 'sync-dot loading'; txt.textContent = 'Syncing...';

  if (!SHEET_ID) {
    dot.className = 'sync-dot'; txt.textContent = 'No sheet connected';
    document.getElementById('configBanner').classList.add('show');
    document.getElementById('loadingOverlay').classList.add('fade');
    return;
  }

  try {
    const [rawProjects, rawActions, rawTasks] = await Promise.all([
      loadSheet(SHEET_ID, 'projects'),
      loadSheet(SHEET_ID, 'action_items').catch(() => []),
      loadSheet(SHEET_ID, 'tasks').catch(() => [])
    ]);

    projects = rawProjects.map(r => ({
      id: r.project_id || '', name: r.project_name || '', section: (r.section||'').toUpperCase(),
      lead: r.lead || '', team: r.team || '', status: r.status || 'ACTIVE'
    }));

    // Build action items with created date estimation
    actionItems = rawActions.filter(r => (r.done||'').toUpperCase() !== 'YES').map(r => ({
      project_id: r.project_id || '', text: r.action_item || '',
      assigned: r.assigned_to || '', priority: (r.priority||'MEDIUM').toUpperCase(),
      created: r.created_date || r.date_added || '',
      done: false
    }));

    // Also pull incomplete tasks as actionable items
    allTasks = rawTasks.filter(r => parseFloat(r.progress||0) < 1).map(r => ({
      project_id: r.project_id || '', name: r.task_name || '',
      assigned: r.assigned_to || '', progress: parseFloat(r.progress||0),
      due: r.due_date || '', start: r.start_date || ''
    }));

    dot.className = 'sync-dot'; txt.textContent = `Synced ${new Date().toLocaleTimeString()}`;
    document.getElementById('configBanner').classList.remove('show');
    buildPersonFilters();
    renderAll();
    document.getElementById('loadingOverlay').classList.add('fade');
  } catch(err) {
    console.error(err);
    dot.className = 'sync-dot error'; txt.textContent = 'Sync failed';
    document.getElementById('configBanner').classList.add('show');
    document.getElementById('loadingOverlay').classList.add('fade');
  }
}

// ============================================================
//  HELPERS
// ============================================================
function projectName(pid) { const p = projects.find(x=>x.id===pid); return p ? p.name : pid; }
function fmtDate(d) { if(!d) return '—'; return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function daysAgo(d) { if(!d) return null; return Math.round((TODAY - new Date(d))/(1000*60*60*24)); }

function enrichItems() {
  // Combine action items + overdue tasks into a unified list
  const items = [];

  actionItems.forEach(ai => {
    const proj = projects.find(p=>p.id===ai.project_id);
    const team = proj ? proj.team.split(' ').filter(Boolean) : [];
    const assigned = ai.assigned || (team.length ? team[0] : '');
    // Estimate age from created date, or from project tasks
    let age = ai.created ? daysAgo(ai.created) : null;
    if (age === null) {
      // Estimate: use earliest task due date in the project as a proxy
      const projTasks = allTasks.filter(t=>t.project_id===ai.project_id);
      const earliest = projTasks.map(t=>t.due||t.start).filter(Boolean).sort()[0];
      age = earliest ? daysAgo(earliest) : 30; // default to 30 if unknown
    }
    items.push({
      type: 'action', text: ai.text, project_id: ai.project_id,
      projectName: proj ? proj.name : ai.project_id,
      section: proj ? proj.section : '',
      assigned, priority: ai.priority, age: Math.max(age,0),
      date: ai.created || '', sortDate: ai.created || '2025-01-01'
    });
  });

  // Add overdue tasks as items
  allTasks.forEach(t => {
    if (!t.due || new Date(t.due) >= TODAY) return; // only overdue
    const proj = projects.find(p=>p.id===t.project_id);
    const age = daysAgo(t.due);
    items.push({
      type: 'overdue_task', text: `${t.name} (${Math.round(t.progress*100)}% done)`,
      project_id: t.project_id, projectName: proj ? proj.name : t.project_id,
      section: proj ? proj.section : '',
      assigned: t.assigned || '', priority: 'HIGH', age,
      date: t.due, sortDate: t.due
    });
  });

  return items;
}

function ageClass(days) { if(days>=30) return 'critical'; if(days>=14) return 'warning'; if(days>=7) return 'recent'; return 'new'; }
function ageLabel(days) { if(days>=30) return `${days}d`; if(days>=14) return `${days}d`; if(days>=7) return `${days}d`; if(days>0) return `${days}d`; return 'new'; }

function getFiltered() {
  let items = enrichItems();
  if (currentPerson !== 'all') items = items.filter(i => i.assigned.toUpperCase() === currentPerson);
  if (currentAge === 'critical') items = items.filter(i => i.age >= 30);
  else if (currentAge === 'warning') items = items.filter(i => i.age >= 14);
  else if (currentAge === 'recent') items = items.filter(i => i.age >= 7);
  if (searchTerm) {
    const s = searchTerm.toLowerCase();
    items = items.filter(i => i.text.toLowerCase().includes(s) || i.projectName.toLowerCase().includes(s) || i.assigned.toLowerCase().includes(s));
  }
  // Sort
  items.sort((a,b) => {
    let va, vb;
    if(sortCol==='age'){va=a.age;vb=b.age;}
    else if(sortCol==='project'){va=a.projectName;vb=b.projectName;}
    else if(sortCol==='assigned'){va=a.assigned;vb=b.assigned;}
    else if(sortCol==='priority'){const o={HIGH:0,MEDIUM:1,LOW:2};va=o[a.priority]||1;vb=o[b.priority]||1;}
    else{va=a.text;vb=b.text;}
    if(typeof va==='number') return sortDir==='desc'?vb-va:va-vb;
    return sortDir==='desc'?(vb||'').localeCompare(va||''):(va||'').localeCompare(vb||'');
  });
  return items;
}

// ============================================================
//  RENDER STATS
// ============================================================
function renderStats() {
  const all = enrichItems();
  const total = all.length;
  const critical = all.filter(i=>i.age>=30).length;
  const warning = all.filter(i=>i.age>=14&&i.age<30).length;
  const people = [...new Set(all.map(i=>i.assigned).filter(Boolean))].length;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card a"><div class="stat-label">Pending Items</div><div class="stat-value" style="color:var(--accent)">${total}</div><div class="stat-sub">action items + overdue tasks</div></div>
    <div class="stat-card r"><div class="stat-label">Critical (30+ days)</div><div class="stat-value" style="color:var(--red)">${critical}</div><div class="stat-sub">need immediate attention</div></div>
    <div class="stat-card o"><div class="stat-label">Aging (14-30 days)</div><div class="stat-value" style="color:var(--orange)">${warning}</div><div class="stat-sub">at risk of slipping</div></div>
    <div class="stat-card g"><div class="stat-label">People Assigned</div><div class="stat-value" style="color:var(--green)">${people}</div><div class="stat-sub">with pending items</div></div>
  `;
}

// ============================================================
//  BUILD PERSON FILTER BUTTONS
// ============================================================
function buildPersonFilters() {
  const all = enrichItems();
  const people = {};
  all.forEach(i => { const a = i.assigned||'UNASSIGNED'; people[a] = (people[a]||0)+1; });
  const sorted = Object.entries(people).sort((a,b)=>b[1]-a[1]);
  const container = document.getElementById('personFilters');
  container.innerHTML = sorted.map(([code,count]) =>
    `<button class="filter-btn" data-person="${code}">${NAME_MAP[code]||code} (${count})</button>`
  ).join('');
  container.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click',()=>{
    document.querySelectorAll('[data-person]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); currentPerson=b.dataset.person; renderAll();
  }));
}

// ============================================================
//  RENDER BY-PERSON VIEW
// ============================================================
function renderPersons() {
  const items = getFiltered();
  const byPerson = {};
  items.forEach(i => { const k=i.assigned||'UNASSIGNED'; if(!byPerson[k]) byPerson[k]=[]; byPerson[k].push(i); });
  const sorted = Object.entries(byPerson).sort((a,b)=>b[1].length-a[1].length);

  let h = '';
  sorted.forEach(([code, items]) => {
    const initials = (NAME_MAP[code]||code).split(' ').map(w=>w[0]).join('');
    const maxAge = Math.max(...items.map(i=>i.age));
    h += `<div class="person-card">
      <div class="person-header">
        <div class="person-left">
          <div class="avatar">${initials}</div>
          <div><div class="person-name">${NAME_MAP[code]||code}</div>
          <div class="person-meta">${code} · oldest: ${maxAge} days</div></div>
        </div>
        <div class="person-count">${items.length}</div>
      </div>
      <div class="person-items">`;
    items.forEach(i => {
      h += `<div class="action-row">
        <div><div class="a-text">${i.type==='overdue_task'?'⚠ ':''}${i.text}</div><div class="a-project">${i.projectName}</div></div>
        <div style="text-align:center"><span class="age-badge ${ageClass(i.age)}">${ageLabel(i.age)}</span></div>
        <div style="text-align:center"><span class="pri-badge ${i.priority.toLowerCase()}">${i.priority}</span></div>
      </div>`;
    });
    h += `</div></div>`;
  });
  document.getElementById('personsView').innerHTML = h || '<div style="padding:40px 28px;color:var(--text3);text-align:center">No pending items found</div>';
}

// ============================================================
//  RENDER BY-PROJECT VIEW
// ============================================================
function renderProjects() {
  const items = getFiltered();
  const byProj = {};
  items.forEach(i => { const k=i.project_id; if(!byProj[k]) byProj[k]=[]; byProj[k].push(i); });
  const sorted = Object.entries(byProj).sort((a,b)=>b[1].length-a[1].length);

  let h = '';
  sorted.forEach(([pid, items]) => {
    const name = items[0].projectName;
    h += `<div class="proj-group">
      <div class="proj-group-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
        <div class="proj-group-name">${name}</div>
        <div class="proj-group-count">${items.length} pending</div>
      </div>
      <div class="proj-group-items">`;
    items.forEach(i => {
      h += `<div class="proj-action">
        <div style="line-height:1.5">${i.type==='overdue_task'?'⚠ ':''}${i.text}</div>
        <div><span class="who-pill">${NAME_MAP[i.assigned]||i.assigned||'—'}</span></div>
        <div style="text-align:center"><span class="age-badge ${ageClass(i.age)}">${ageLabel(i.age)}</span></div>
        <div style="text-align:center"><span class="pri-badge ${i.priority.toLowerCase()}">${i.priority}</span></div>
      </div>`;
    });
    h += `</div></div>`;
  });
  document.getElementById('projectsView').innerHTML = h || '<div style="padding:40px;color:var(--text3);text-align:center">No pending items found</div>';
}

// ============================================================
//  RENDER TABLE VIEW
// ============================================================
function renderTable() {
  const items = getFiltered();
  const arrow = col => sortCol===col ? (sortDir==='desc'?'↓':'↑') : '';
  const cls = col => sortCol===col ? 'sorted' : '';
  let h = `<table><thead><tr>
    <th class="${cls('text')}" onclick="setSort('text')" style="width:35%">Action Item <span class="arrow">${arrow('text')}</span></th>
    <th class="${cls('project')}" onclick="setSort('project')" style="width:20%">Project <span class="arrow">${arrow('project')}</span></th>
    <th class="${cls('assigned')}" onclick="setSort('assigned')" style="width:12%">Assigned <span class="arrow">${arrow('assigned')}</span></th>
    <th class="${cls('priority')}" onclick="setSort('priority')" style="width:10%">Priority <span class="arrow">${arrow('priority')}</span></th>
    <th class="${cls('age')}" onclick="setSort('age')" style="width:10%">Age <span class="arrow">${arrow('age')}</span></th>
    <th style="width:10%">Since</th>
  </tr></thead><tbody>`;
  items.forEach(i => {
    h += `<tr>
      <td class="item-cell">${i.type==='overdue_task'?'⚠ ':''}${i.text}</td>
      <td class="proj-cell">${i.projectName}</td>
      <td class="who-cell"><span class="who-pill">${NAME_MAP[i.assigned]||i.assigned||'—'}</span></td>
      <td><span class="pri-badge ${i.priority.toLowerCase()}">${i.priority}</span></td>
      <td style="text-align:center"><span class="age-badge ${ageClass(i.age)}">${ageLabel(i.age)}</span></td>
      <td style="text-align:center;font-size:11px;color:var(--text3)" class="mono">${fmtDate(i.date)}</td>
    </tr>`;
  });
  h += `</tbody></table>`;
  document.getElementById('tableView').innerHTML = h;
}

function setSort(col) {
  if(sortCol===col) sortDir=sortDir==='desc'?'asc':'desc';
  else{sortCol=col;sortDir='desc';}
  renderAll();
}

// ============================================================
//  CONFIG
// ============================================================
function saveConfig() {
  SHEET_ID = document.getElementById('inputSheetId').value.trim();
  const match = SHEET_ID.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (match) SHEET_ID = match[1];
  localStorage.setItem('ad_tracker_sheet_id', SHEET_ID);
  fetchAll();
}

// ============================================================
//  EVENTS
// ============================================================
document.querySelector('[data-person="all"]').addEventListener('click',()=>{
  document.querySelectorAll('[data-person]').forEach(x=>x.classList.remove('active'));
  document.querySelector('[data-person="all"]').classList.add('active');
  currentPerson='all'; renderAll();
});
document.querySelectorAll('[data-age]').forEach(b => b.addEventListener('click',()=>{
  if(b.classList.contains('active')){b.classList.remove('active');currentAge=null;}
  else{document.querySelectorAll('[data-age]').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentAge=b.dataset.age;}
  renderAll();
}));
document.getElementById('searchBox').addEventListener('input',e=>{searchTerm=e.target.value;renderAll();});
document.querySelectorAll('.view-tab').forEach(t => t.addEventListener('click',()=>{
  document.querySelectorAll('.view-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');
  const v=t.dataset.view;
  document.getElementById('personsView').classList.toggle('hidden',v!=='persons');
  document.getElementById('projectsView').classList.toggle('hidden',v!=='projects');
  document.getElementById('tableView').classList.toggle('hidden',v!=='table');
  renderAll();
}));

function renderAll(){renderStats();renderPersons();renderProjects();renderTable();}

if(SHEET_ID) document.getElementById('inputSheetId').value=SHEET_ID;
fetchAll();
</script>
</body>
</html>
